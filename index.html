<script>
const ADMIN_PASSWORD = 'Tainav';

const state = {
  screen: 'home',        // home | new | report | add
  reports: [],
  currentReportId: null,
  currentHeader: null,
  currentEntries: [],
  pendingPhotos: [],      // [{dataUrl, w, h, phase}]
  authorName: '',
  loading: false,
  expandedTasks: new Set()
};

function phaseLabel(entry){
  const phase = typeof entry === 'string' ? entry : entry.phase;
  if(phase === 'Outro'){
    const text = (typeof entry === 'object' && entry.phaseText) ? entry.phaseText : 'Outro';
    return text;
  }
  return phase === 'Durante' ? 'Durante a Atividade' : `${phase} da Atividade`;
}

function slugify(s){
  return (s||'').toString().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');
}

function applyTaskOrder(tasksPresent, savedOrder){
  savedOrder = savedOrder || [];
  const inSaved = savedOrder.filter(t => tasksPresent.includes(t));
  const notInSaved = tasksPresent.filter(t => !savedOrder.includes(t));
  return [...inSaved, ...notInSaved];
}

async function moveTask(direction, task){
  const header = state.currentHeader;
  const currentOrder = applyTaskOrder([...new Set(state.currentEntries.map(e=>e.task))], header.taskOrder);
  const idx = currentOrder.indexOf(task);
  const swapWith = direction === 'up' ? idx-1 : idx+1;
  if(swapWith < 0 || swapWith >= currentOrder.length) return;
  [currentOrder[idx], currentOrder[swapWith]] = [currentOrder[swapWith], currentOrder[idx]];
  await updateReportHeader(state.currentReportId, {taskOrder: currentOrder});
  state.currentHeader = await fetchHeader(state.currentReportId);
  renderReportBody();
}

async function moveEntry(direction, key, task){
  const taskEntries = state.currentEntries.filter(e=>e.task===task).sort((a,b)=>a.ts-b.ts);
  const idx = taskEntries.findIndex(e=>e.key===key);
  const swapWith = direction === 'up' ? idx-1 : idx+1;
  if(swapWith < 0 || swapWith >= taskEntries.length) return;
  const a = taskEntries[idx], b = taskEntries[swapWith];
  await Promise.all([
    updateEntry(state.currentReportId, a.key, {ts: b.ts}),
    updateEntry(state.currentReportId, b.key, {ts: a.ts}),
  ]);
  state.currentEntries = await fetchEntries(state.currentReportId);
  renderReportBody();
}

async function toggleEntryPageBreak(key){
  const entry = state.currentEntries.find(e=>e.key===key);
  if(!entry) return;
  const newVal = !entry.pageBreakBefore;
  await updateEntry(state.currentReportId, key, {pageBreakBefore: newVal});
  entry.pageBreakBefore = newVal;
  renderReportBody();
}

// Generic press-and-drag reordering for a flat list of sibling items inside `container`.
// `itemSelector` identifies the draggable items; `handleSelector` identifies the grip that starts the drag.
// `onReorder(orderedItemElements)` is called once the drag ends, with items in their new DOM order.
function enableDragReorder(container, itemSelector, handleSelector, onReorder){
  let dragging = null, startY = 0;
  const items = ()=> Array.from(container.querySelectorAll(itemSelector));

  function onPointerMove(e){
    if(!dragging) return;
    e.preventDefault();
    const dy = e.clientY - startY;
    dragging.style.transform = `translateY(${dy}px)`;
    const dRect = dragging.getBoundingClientRect();
    const dCenter = dRect.top + dRect.height/2;
    for(const sib of items()){
      if(sib === dragging) continue;
      const sRect = sib.getBoundingClientRect();
      const sCenter = sRect.top + sRect.height/2;
      if(Math.abs(dCenter - sCenter) < sRect.height/2){
        const children = Array.from(container.children);
        const dIdx = children.indexOf(dragging);
        const sIdx = children.indexOf(sib);
        if(dIdx < sIdx) container.insertBefore(dragging, sib.nextSibling);
        else container.insertBefore(dragging, sib);
        const prevTop = dRect.top;
        dragging.style.transform = '';
        const restRect = dragging.getBoundingClientRect();
        const newDy = prevTop - restRect.top;
        dragging.style.transform = `translateY(${newDy}px)`;
        startY = e.clientY - newDy;
        break;
      }
    }
  }

  function onPointerUp(){
    if(!dragging) return;
    const el = dragging;
    el.style.transform = '';
    el.style.position = '';
    el.style.zIndex = '';
    el.style.transition = '';
    el.classList.remove('dragging-item');
    document.removeEventListener('pointermove', onPointerMove);
    document.removeEventListener('pointerup', onPointerUp);
    dragging = null;
    onReorder(items());
  }

  container.addEventListener('pointerdown', (e)=>{
    const handle = e.target.closest(handleSelector);
    if(!handle || !container.contains(handle)) return;
    const item = handle.closest(itemSelector);
    if(!item) return;
    e.preventDefault();
    dragging = item;
    startY = e.clientY;
    item.classList.add('dragging-item');
    item.style.position = 'relative';
    item.style.zIndex = '100';
    item.style.transition = 'none';
    document.addEventListener('pointermove', onPointerMove);
    document.addEventListener('pointerup', onPointerUp);
  });
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}

async function loadAuthorName(){
  try{
    const v = localStorage.getItem('author-name');
    if(v) state.authorName = v;
  }catch(e){}
}
async function saveAuthorName(name){
  state.authorName = name;
  try{ localStorage.setItem('author-name', name); }catch(e){}
}

// ---------- Data layer ----------

async function fetchReports(){
  try{
    const snap = await db.collection('reports').get();
    const reports = [];
    for(const docSnap of snap.docs){
      const header = docSnap.data();
      const entriesSnap = await db.collection('reports').doc(docSnap.id).collection('entries').get();
      reports.push({id: docSnap.id, header, count: entriesSnap.size});
    }
    reports.sort((a,b)=> (b.header.criadoEm||0) - (a.header.criadoEm||0));
    return reports;
  }catch(e){
    console.error('fetchReports', e);
    return [];
  }
}

async function createReport(data){
  const id = slugify(`${data.embarcacao}-${data.turma}-${data.periodo}`) || ('relatorio-' + Date.now());
  const header = {...data, criadoEm: Date.now()};
  await db.collection('reports').doc(id).set(header);
  return id;
}

async function deleteReport(id){
  const entriesSnap = await db.collection('reports').doc(id).collection('entries').get();
  const batchDeletes = entriesSnap.docs.map(d => d.ref.delete());
  await Promise.all(batchDeletes);
  await db.collection('reports').doc(id).delete();
}

// ---------- Access requests ----------

async function submitAccessRequest(name){
  const ref = await db.collection('accessRequests').add({
    name, status: 'pending', requestedAt: Date.now()
  });
  return ref.id;
}

async function getAccessRequest(id){
  const docSnap = await db.collection('accessRequests').doc(id).get();
  return docSnap.exists ? { id: docSnap.id, ...docSnap.data() } : null;
}

async function fetchAllAccessRequests(){
  const snap = await db.collection('accessRequests').get();
  const list = snap.docs.map(d=>({ id: d.id, ...d.data() }));
  list.sort((a,b)=> (b.requestedAt||0) - (a.requestedAt||0));
  return list;
}

async function setAccessRequestStatus(id, status){
  await db.collection('accessRequests').doc(id).update({ status });
}

async function fetchHeader(id){
  const docSnap = await db.collection('reports').doc(id).get();
  return docSnap.exists ? docSnap.data() : null;
}

async function updateReportHeader(id, data){
  await db.collection('reports').doc(id).update(data);
}

async function fetchEntries(id){
  const snap = await db.collection('reports').doc(id).collection('entries').get();
  const entries = snap.docs.map(d => ({key: d.id, ...d.data()}));
  entries.sort((a,b)=>(a.ts||0)-(b.ts||0));
  return entries;
}

async function addEntry(reportId, entry){
  const entryId = `${Date.now()}-${Math.random().toString(36).slice(2,8)}`;
  await db.collection('reports').doc(reportId).collection('entries').doc(entryId).set(entry);
}

async function deleteEntry(key){
  await db.collection('reports').doc(state.currentReportId).collection('entries').doc(key).delete();
}

async function updateEntry(reportId, key, data){
  await db.collection('reports').doc(reportId).collection('entries').doc(key).update(data);
}

async function moveEntryToReport(sourceReportId, targetReportId, entry, newTask, keepOriginal){
  const { key, ...data } = entry;
  data.task = newTask;
  await addEntry(targetReportId, data);
  if(!keepOriginal){
    await db.collection('reports').doc(sourceReportId).collection('entries').doc(key).delete();
  }
}

async function moveTaskToReport(sourceReportId, targetReportId, entries, newTask, keepOriginal){
  for(const entry of entries){
    await moveEntryToReport(sourceReportId, targetReportId, entry, newTask, keepOriginal);
  }
}

async function renameTask(oldTask){
  const input = prompt('Novo nome da tarefa:', oldTask);
  if(input === null) return;
  const newTask = input.trim();
  if(!newTask || newTask === oldTask) return;

  const entries = state.currentEntries.filter(e=>e.task===oldTask);
  await Promise.all(entries.map(e=> updateEntry(state.currentReportId, e.key, {task: newTask})));

  const header = state.currentHeader;
  if(header.taskOrder && header.taskOrder.includes(oldTask)){
    const newOrder = header.taskOrder.map(t=> t===oldTask ? newTask : t);
    await updateReportHeader(state.currentReportId, {taskOrder: newOrder});
    state.currentHeader = await fetchHeader(state.currentReportId);
  }

  if(state.expandedTasks.has(oldTask)){
    state.expandedTasks.delete(oldTask);
    state.expandedTasks.add(newTask);
  }

  state.currentEntries = await fetchEntries(state.currentReportId);
  showToast('Tarefa renomeada!');
  renderReportBody();
}

// ---------- Image handling ----------

function compressImage(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        const maxDim = 1100;
        let w = img.width, h = img.height;
        if(w > h && w > maxDim){ h = Math.round(h * maxDim/w); w = maxDim; }
        else if(h > maxDim){ w = Math.round(w * maxDim/h); h = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        const dataUrl = canvas.toDataURL('image/jpeg', 0.62);
        resolve({dataUrl, w, h});
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// ---------- PDF generation ----------

async function buildPDFDoc(reportId){
  const header = state.currentHeader;
  const entries = state.currentEntries;
  if(entries.length === 0){ showToast('Adicione ao menos uma foto antes de gerar o relatório.'); return; }

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({orientation:'landscape', unit:'pt', format:[780,540]});
  const PW = 780, PH = 540;
  const navy = [31,56,100], blue = [68,114,196], orange=[237,125,49], muted=[91,100,114];

  // Cover page
  doc.setDrawColor(...blue); doc.setLineWidth(2);
  doc.rect(50, 40, PW-100, 100);
  doc.setTextColor(...navy);
  doc.setFont('helvetica','bold'); doc.setFontSize(20);
  doc.text('Relatório Semanal de Atividades', PW/2, 78, {align:'center'});
  doc.setFontSize(14);
  doc.text('Registro Fotográfico', PW/2, 105, {align:'center'});

  const rows = [
    ['Embarcação:', header.embarcacao||'-'],
    ['Turma:', header.turma||'-'],
    ['CMT || CFM:', header.cmtcfm||'-'],
    ['Setor:', header.setor||'-'],
    ['Período:', header.periodo||'-'],
  ];
  let ry = 190;
  doc.setFont('helvetica','normal'); doc.setFontSize(12);
  rows.forEach(([label,val])=>{
    const valLines = doc.splitTextToSize(String(val), 330);
    const rowH = Math.max(32, 16 + valLines.length*14);
    doc.setFillColor(232,236,242);
    doc.rect(140, ry-16, 500, rowH, 'F');
    doc.setDrawColor(200,206,216);
    doc.rect(140, ry-16, 500, rowH);
    doc.setFont('helvetica','bold'); doc.setTextColor(...navy);
    doc.text(label, 152, ry+5);
    doc.setFont('helvetica','normal'); doc.setTextColor(20,20,20);
    doc.text(valLines, 280, ry+5);
    ry += rowH;
  });
  doc.setDrawColor(...orange); doc.setLineWidth(10);
  doc.line(PW-6, 0, PW-6, PH);

  // Page 2: Colaboradores
  doc.addPage([780,540], 'landscape');
  doc.setDrawColor(...blue); doc.setLineWidth(2);
  doc.rect(50, 40, PW-100, 60);
  doc.setTextColor(...navy);
  doc.setFont('helvetica','bold'); doc.setFontSize(18);
  doc.text('Colaboradores', PW/2, 78, {align:'center'});

  const names = (header.colaboradores||'').split(',').map(n=>n.trim()).filter(Boolean);
  if(names.length === 0){
    doc.setFont('helvetica','normal'); doc.setFontSize(12); doc.setTextColor(...muted);
    doc.text('Nenhum colaborador informado.', PW/2, 160, {align:'center'});
  } else {
    const rowH = 42;
    const listW = 420;
    const listX = (PW-listW)/2;
    doc.setFont('helvetica','normal'); doc.setFontSize(20);
    names.forEach((name, i)=>{
      const by = 190 + i*rowH;
      doc.setTextColor(...blue);
      doc.text('•', listX, by);
      doc.setTextColor(20,20,20);
      doc.text(name, listX+22, by);
    });
  }
  doc.setDrawColor(...orange); doc.setLineWidth(10);
  doc.line(PW-6, 0, PW-6, PH);

  // group entries by task, preserving first-seen order; within task order Antes/Durante/Depois then time
  const order = {Antes:0, Durante:1, Depois:2};
  let taskOrder = [];
  const byTask = {};
  entries.forEach(e=>{
    if(!byTask[e.task]){ byTask[e.task]=[]; taskOrder.push(e.task); }
    byTask[e.task].push(e);
  });
  taskOrder.forEach(t=> byTask[t].sort((a,b)=> (a.ts-b.ts)));
  taskOrder = applyTaskOrder(taskOrder, header.taskOrder);

  // Page 3+: Tarefas realizadas (com quebra automática de página)
  function drawTaskListPageHeader(isContinuation){
    doc.addPage([780,540], 'landscape');
    doc.setDrawColor(...blue); doc.setLineWidth(2);
    doc.rect(50, 40, PW-100, 60);
    doc.setTextColor(...navy);
    doc.setFont('helvetica','bold'); doc.setFontSize(18);
    doc.text(isContinuation ? 'Tarefas Realizadas (continuação)' : 'Tarefas Realizadas', PW/2, 78, {align:'center'});
  }

  drawTaskListPageHeader(false);

  if(taskOrder.length === 0){
    doc.setFont('helvetica','normal'); doc.setFontSize(12); doc.setTextColor(...muted);
    doc.text('Nenhuma tarefa registrada.', PW/2, 160, {align:'center'});
  } else {
    const listW = 620;
    const listX = (PW-listW)/2;
    const maxY = PH - 40;
    let ty = 130;
    taskOrder.forEach((task)=>{
      doc.setFont('helvetica','bold'); doc.setFontSize(15);
      const lines = doc.splitTextToSize(task || '(sem título)', listW-24);
      const blockH = lines.length*20 + 12;
      if(ty + blockH > maxY){
        doc.setDrawColor(...orange); doc.setLineWidth(10);
        doc.line(PW-6, 0, PW-6, PH);
        drawTaskListPageHeader(true);
        ty = 130;
      }
      doc.setFont('helvetica','bold'); doc.setFontSize(15);
      doc.setTextColor(...blue);
      doc.text('•', listX, ty);
      doc.setTextColor(20,20,20);
      doc.text(lines, listX+20, ty);
      ty += blockH;
    });
  }
  doc.setDrawColor(...orange); doc.setLineWidth(10);
  doc.line(PW-6, 0, PW-6, PH);

  const maxPhotosPerSlide = Math.min(4, Math.max(1, header.photosPerSlide || 2));

  function chunkTaskEntries(taskEntries){
    const chunks = [];
    let current = [];
    for(const entry of taskEntries){
      if(current.length > 0 && (entry.pageBreakBefore || current.length >= maxPhotosPerSlide)){
        chunks.push(current);
        current = [];
      }
      current.push(entry);
    }
    if(current.length > 0) chunks.push(current);
    return chunks;
  }

  for(const task of taskOrder){
    const taskEntries = byTask[task];
    for(const chunk of chunkTaskEntries(taskEntries)){
      doc.addPage([780,540], 'landscape');
      // title
      doc.setTextColor(...blue);
      doc.setFont('helvetica','normal'); doc.setFontSize(26);
      doc.text('REGISTRO FOTOGRÁFICO', 40, 55);
      doc.setDrawColor(...blue); doc.setLineWidth(1.5);
      doc.line(40, 66, PW-60, 66);

      // task box
      doc.setDrawColor(...blue); doc.setLineWidth(1);
      const taskLines = doc.splitTextToSize(task || '(sem título)', PW-140);
      const boxH = 24 + taskLines.length*16;
      doc.rect(40, 78, PW-100, boxH);
      doc.setTextColor(20,20,20); doc.setFont('helvetica','bold'); doc.setFontSize(13);
      doc.text(taskLines, PW/2, 78+20, {align:'center'});

      const areaTop = 78 + boxH + 8;
      const areaBottom = PH - 20;
      const areaH = areaBottom - areaTop;
      const labelH = 22, labelGap = 8;
      const pageMode = chunk[0].pageMode === 'text' ? 'text' : 'tags';

      if(pageMode === 'text'){
        // Single free-text note for the whole page, instead of per-photo labels
        doc.setFont('helvetica','bold'); doc.setFontSize(12);
        const noteText = (chunk[0].pageText || '').trim() || ' ';
        const noteLines = doc.splitTextToSize(noteText, PW-120);
        const noteBoxH = Math.max(30, noteLines.length*15 + 16);
        const photosAreaH = areaH - noteBoxH - 10;

        const cols = chunk.length === 4 ? 2 : chunk.length;
        const rows = Math.ceil(chunk.length / cols);
        const gap = 10;
        const cellW = (PW - 80 - gap*(cols-1)) / cols;
        const cellH = (photosAreaH - gap*(rows-1)) / rows;

        chunk.forEach((entry, idx)=>{
          const col = idx % cols;
          const row = Math.floor(idx / cols);
          const cellX = 40 + col*(cellW+gap);
          const cellY = areaTop + row*(cellH+gap);
          try{
            const ratio = Math.min(cellW/entry.w, cellH/entry.h);
            const iw = entry.w*ratio, ih = entry.h*ratio;
            const ix = cellX + (cellW-iw)/2;
            const iy = cellY + (cellH-ih)/2;
            doc.addImage(entry.photo, 'JPEG', ix, iy, iw, ih);
          }catch(err){ console.error('img err', err); }
        });

        const noteY = areaTop + photosAreaH + 10;
        doc.setDrawColor(...blue); doc.setLineWidth(1);
        doc.rect(40, noteY, PW-80, noteBoxH);
        doc.setTextColor(20,20,20); doc.setFont('helvetica','bold'); doc.setFontSize(12);
        doc.text(noteLines, PW/2, noteY + noteBoxH/2 - (noteLines.length-1)*7 + 4, {align:'center'});
      } else {
        // Grid: 1 -> 1x1; 2 -> 1x2 (uma linha); 3 -> 1x3 (uma linha); 4 -> 2x2
        const cols = chunk.length === 4 ? 2 : chunk.length;
        const rows = Math.ceil(chunk.length / cols);
        const gap = 10;
        const cellW = (PW - 80 - gap*(cols-1)) / cols;
        const cellH = (areaH - gap*(rows-1)) / rows;
        const labelFontSize = chunk.length<=2 ? 12 : 10.5;
        const lineH = chunk.length<=2 ? 14 : 12;
        const labelPadW = chunk.length<=2 ? 24 : 18;
        const maxLabelTextW = cellW - labelPadW - 4;

        // Wrap every label first so all cells in this page reserve the same vertical space
        // for the tallest caption (keeps the grid aligned and never lets text spill into
        // the neighbouring photo — the box grows downward instead).
        doc.setFont('helvetica','bold'); doc.setFontSize(labelFontSize);
        const wrappedLabels = chunk.map(entry => doc.splitTextToSize(phaseLabel(entry), maxLabelTextW));
        const maxLines = Math.max(1, ...wrappedLabels.map(l => l.length));
        const labelH = maxLines*lineH + 10;
        const maxImgH = cellH - labelH - labelGap;

        chunk.forEach((entry, idx)=>{
          const col = idx % cols;
          const row = Math.floor(idx / cols);
          const cellX = 40 + col*(cellW+gap);
          const cellY = areaTop + row*(cellH+gap);
          try{
            const ratio = Math.min(cellW/entry.w, maxImgH/entry.h);
            const iw = entry.w*ratio, ih = entry.h*ratio;
            const blockH = ih + labelGap + labelH;
            const blockTop = cellY + (cellH-blockH)/2;
            const ix = cellX + (cellW-iw)/2;
            doc.addImage(entry.photo, 'JPEG', ix, blockTop, iw, ih);

            doc.setDrawColor(...blue); doc.setLineWidth(1);
            const lines = wrappedLabels[idx];
            doc.setFont('helvetica','bold'); doc.setFontSize(labelFontSize);
            const lw = Math.min(cellW-4, Math.max(...lines.map(l=>doc.getTextWidth(l))) + labelPadW);
            const lx = cellX + (cellW-lw)/2;
            const labelRectY = blockTop + ih + labelGap;
            doc.rect(lx, labelRectY, lw, labelH);
            doc.setTextColor(20,20,20);
            const textY = labelRectY + labelH/2 - (lines.length-1)*lineH/2 + 4;
            doc.text(lines, cellX+cellW/2, textY, {align:'center'});
          }catch(err){ console.error('img err', err); }
        });
      }

      // sidebar stripes (echo template branding)
      doc.setDrawColor(...orange); doc.setLineWidth(10);
      doc.line(PW-6, 0, PW-6, PH*0.18);
      doc.setDrawColor(...navy); doc.setLineWidth(10);
      doc.line(PW-6, PH*0.18, PW-6, PH);

      const authors = [...new Set(chunk.map(e=>e.author).filter(Boolean))];
      if(authors.length){
        doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.setTextColor(...muted);
        doc.text(`Registrado por: ${authors.join(', ')}`, 40, PH-14);
      }
    }
  }

  const fname = `Relatorio_${slugify(header.embarcacao)}_${slugify(header.turma)}.pdf`;
  return {doc, fname};
}

async function showPdfPreview(reportId){
  const result = await buildPDFDoc(reportId);
  if(!result) return;
  const { doc, fname } = result;
  const blobUrl = doc.output('bloburl');
  state.pdfPreview = { doc, fname, blobUrl };

  const overlay = document.createElement('div');
  overlay.id = 'pdf-preview-overlay';
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(10,14,24,.92);z-index:200;display:flex;flex-direction:column;';
  overlay.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;padding:14px 18px;background:var(--navy);color:#fff;flex:none;">
      <div style="font-weight:700;font-size:15px;">Pré-visualização do relatório</div>
      <button id="pdf-preview-close" style="background:none;border:none;color:#fff;font-size:24px;cursor:pointer;line-height:1;">✕</button>
    </div>
    <iframe src="${blobUrl}" style="flex:1;border:none;width:100%;background:#525659;"></iframe>
    <div style="padding:14px 18px;background:var(--bg);display:flex;gap:10px;flex:none;">
      <button class="btn btn-ghost" id="pdf-preview-close-2" style="flex:1;">Fechar</button>
      <button class="btn btn-primary" id="pdf-preview-download" style="flex:1.4;">⬇ Baixar PDF</button>
    </div>
  `;
  document.body.appendChild(overlay);
  const close = ()=>{
    const el = document.getElementById('pdf-preview-overlay');
    if(el) el.remove();
    if(state.pdfPreview && state.pdfPreview.blobUrl) URL.revokeObjectURL(state.pdfPreview.blobUrl);
    state.pdfPreview = null;
  };
  document.getElementById('pdf-preview-close').onclick = close;
  document.getElementById('pdf-preview-close-2').onclick = close;
  document.getElementById('pdf-preview-download').onclick = ()=>{
    state.pdfPreview.doc.save(state.pdfPreview.fname);
  };
}

async function checkAccessStatus(manual){
  const reqId = localStorage.getItem('accessRequestId');
  if(!reqId) return;
  try{
    const reqDoc = await getAccessRequest(reqId);
    if(reqDoc && reqDoc.status === 'approved'){
      if(state.accessPollTimer){ clearInterval(state.accessPollTimer); state.accessPollTimer = null; }
      localStorage.setItem('accessApproved', '1');
      state.screen = 'home';
      await loadAuthorName();
      render();
    } else if(reqDoc && reqDoc.status === 'denied'){
      state.screen = 'access-denied';
      render();
    } else if(manual){
      showToast('Ainda aguardando aprovação.');
    }
  }catch(e){ console.error(e); if(manual) showToast('Erro ao verificar.'); }
}

function renderHome(){
  app.innerHTML = `
    <header class="topbar">

        <div class="sub">Relatórios semanais de atividades</div>

  const main = document.getElementById('main');
  main.innerHTML = `<div class="empty"><div class="big">⏳</div>Carregando relatórios…</div>`;

  const setorOrder = ['Máquinas', 'Passadiço', 'Embarcação'];

  function reportItemHtml(r){
    return `
      <div class="report-item" data-id="${r.id}">
        <div class="ri-left">
          <div class="ri-title">${escapeHtml(r.header.embarcacao)} — ${escapeHtml(r.header.turma)}</div>
          <div class="ri-sub">${escapeHtml(r.header.periodo||'')}</div>
        </div>
        <div class="ri-count">${r.count} 📷</div>
        <button class="ri-del" data-id="${r.id}" style="background:none;border:none;color:var(--danger);font-size:18px;padding:6px;cursor:pointer;flex:none;">✕</button>
      </div>
    `;
  }

  fetchReports().then(reports=>{
    state.reports = reports;
    if(reports.length === 0){
      main.innerHTML = `<div class="empty"><div class="big">📷</div>Nenhum relatório ainda.<br>Toque em "Novo relatório semanal" para começar.</div>`;
      return;
    }

    const bySetor = {};
    setorOrder.forEach(s=> bySetor[s] = []);
    const outros = [];
    reports.forEach(r=>{
      const s = r.header.setor;
      if(s && bySetor[s]) bySetor[s].push(r);
      else outros.push(r);
    });

    let html = '';
    setorOrder.forEach(setor=>{
      const list = bySetor[setor];
      if(list.length === 0) return;
      html += `<div class="task-group-title" style="margin-top:4px;">${escapeHtml(setor)}</div>`;
      html += list.map(reportItemHtml).join('');
    });
    if(outros.length > 0){
      html += `<div class="task-group-title" style="margin-top:4px;">Outros</div>`;
      html += outros.map(reportItemHtml).join('');
    }
    main.innerHTML = html;

    main.querySelectorAll('.report-item').forEach(el=>{
      el.onclick = (ev)=>{
        if(ev.target.closest('.ri-del')) return;
        openReport(el.getAttribute('data-id'));
      };
    });
    main.querySelectorAll('.ri-del').forEach(btn=>{
      btn.onclick = async (ev)=>{
        ev.stopPropagation();
        const id = btn.getAttribute('data-id');
        const r = state.reports.find(x=>x.id===id);
        const label = r ? `${r.header.embarcacao} — ${r.header.turma} (${r.header.periodo||''})` : 'este relatório';
        if(!confirm(`Excluir "${label}"? Isso apaga todas as fotos dele e não pode ser desfeito.`)) return;
        btn.disabled = true;
        try{
          await deleteReport(id);
          showToast('Relatório excluído.');
          renderHome();
        }catch(e){
          console.error(e); showToast('Erro ao excluir.'); btn.disabled = false;
        }
      };
    });
  });
}

    btn.onclick = ()=>{
      selectedSetor = btn.getAttribute('data-setor');
      document.querySelectorAll('#setor-choice .phase-btn').forEach(b=>b.className='phase-btn');
      btn.className = 'phase-btn active-Durante';
    };
  });
  let selectedPpp = h.photosPerSlide || 2;
  document.querySelectorAll('#ppp-choice .phase-btn').forEach(btn=>{
    btn.onclick = ()=>{
      selectedPpp = Number(btn.getAttribute('data-ppp'));
      document.querySelectorAll('#ppp-choice .phase-btn').forEach(b=>b.className='phase-btn');
      btn.className = 'phase-btn active-Durante';
    };
  });
  if(isEdit){
    document.getElementById('btn-delete-report').onclick = async ()=>{
      const label = `${h.embarcacao} — ${h.turma} (${h.periodo||''})`;
      if(!confirm(`Excluir "${label}"? Isso apaga todas as fotos dele e não pode ser desfeito.`)) return;
      const btn = document.getElementById('btn-delete-report');
      btn.innerHTML = '<span class="spinner"></span> Excluindo…'; btn.disabled = true;
      try{
        await deleteReport(state.currentReportId);
        showToast('Relatório excluído.');
        state.currentReportId = null;
        state.screen = 'home';
        render();
      }catch(e){
        console.error(e); showToast('Erro ao excluir.');
        btn.innerHTML = 'Excluir este relatório'; btn.disabled = false;
      }
    };
  }
  document.getElementById('btn-save-header').onclick = async ()=>{
    if(!selectedSetor){ showToast('Selecione o setor.'); return; }
    const data = {
      embarcacao: document.getElementById('f-embarcacao').value.trim(),
      turma: document.getElementById('f-turma').value.trim(),
      cmtcfm: document.getElementById('f-cmtcfm').value.trim(),
      setor: selectedSetor,
      periodo: document.getElementById('f-periodo').value.trim(),
      colaboradores: document.getElementById('f-colaboradores').value.trim(),
      photosPerSlide: selectedPpp,
    };
    if(!data.embarcacao || !data.periodo){ showToast('Preencha ao menos Embarcação e Período.'); return; }
    const btn = document.getElementById('btn-save-header');
    btn.innerHTML = '<span class="spinner"></span> Salvando…'; btn.disabled = true;
    try{
      if(isEdit){
        await updateReportHeader(state.currentReportId, data);
        showToast('Cabeçalho atualizado!');
        await openReport(state.currentReportId);
      } else {
        const id = await createReport(data);
        showToast('Relatório criado!');
        await openReport(id);
      }
    }catch(e){
      console.error(e); showToast('Erro ao salvar.'); btn.innerHTML = isEdit?'Salvar alterações':'Criar relatório'; btn.disabled=false;
    }
  };
}

async function openReport(id){
  state.currentReportId = id;
  state.screen = 'report';
  render();
  const main = document.getElementById('main');
  main.innerHTML = `<div class="empty"><div class="big">⏳</div>Carregando…</div>`;
  const [header, entries] = await Promise.all([fetchHeader(id), fetchEntries(id)]);
  state.currentHeader = header;
  state.currentEntries = entries;
  renderReportBody();
}

function renderReport(){
  app.innerHTML = `
    <header class="topbar">
      <button class="back" id="btn-back">←</button>
      <div>
        <h1 id="hdr-title">Relatório</h1>
        <div class="sub" id="hdr-sub"></div>
      </div>
    </header>
    <main id="main"></main>
    <div class="fab-bar"><div class="fab-bar-inner">
      <button class="btn btn-ghost btn-sm" id="btn-pdf" style="flex:1;">👁 Pré-visualizar PDF</button>
      <button class="btn btn-orange" id="btn-add" style="flex:1.4;">＋ Adicionar fotos</button>
    </div></div>
  `;
  document.getElementById('btn-back').onclick = ()=>{ state.screen='home'; render(); };
  document.getElementById('btn-add').onclick = ()=>{ state.screen='add'; state.pendingPhotos=[]; render(); };
  document.getElementById('btn-pdf').onclick = async (e)=>{
    const btn = e.currentTarget;
    const orig = btn.innerHTML;
    btn.innerHTML = '<span class="spinner"></span>'; btn.disabled = true;

    btn.innerHTML = orig; btn.disabled = false;
  };
}

function renderReportBody(){
  const header = state.currentHeader;
  document.getElementById('hdr-title').textContent = header ? `${header.embarcacao} — ${header.turma}` : 'Relatório';
  document.getElementById('hdr-sub').textContent = header ? header.periodo : '';

  const main = document.getElementById('main');
  const entries = state.currentEntries;

  let headerCard = `
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <h2 style="margin:0;">Dados do relatório</h2>
        <button class="btn btn-ghost btn-sm" id="btn-edit-header">✎ Editar</button>
      </div>
      <div class="header-summary" style="margin-top:10px;">
        <b>Embarcação:</b> ${escapeHtml(header.embarcacao)}<br>
        <b>Turma:</b> ${escapeHtml(header.turma)}<br>
        <b>CMT || CFM:</b> ${escapeHtml(header.cmtcfm||'-')}<br>
        <b>Setor:</b> ${escapeHtml(header.setor||'-')}<br>
        <b>Período:</b> ${escapeHtml(header.periodo)}<br>
        <b>Colaboradores:</b> ${escapeHtml(header.colaboradores||'-')}
      </div>
    </div>
  `;

  if(entries.length === 0){
    main.innerHTML = headerCard + `<div class="empty"><div class="big">📷</div>Nenhuma foto adicionada ainda.<br>Toque em "Adicionar foto" abaixo.</div>`;
    document.getElementById('btn-edit-header').onclick = ()=>{ state.screen='edit-header'; render(); };
    return;
  }

  const order = {Antes:0, Durante:1, Depois:2};
  let taskOrder = []; const byTask = {};
  entries.forEach(e=>{ if(!byTask[e.task]){byTask[e.task]=[];taskOrder.push(e.task);} byTask[e.task].push(e); });
  taskOrder.forEach(t=> byTask[t].sort((a,b)=> (a.ts-b.ts)));
  taskOrder = applyTaskOrder(taskOrder, header.taskOrder);

  let groupsHtml = taskOrder.map((task, idx)=>{
    const taskEntries = byTask[task];
    const rowsParts = taskEntries.map((entry, eIdx)=>{
      const isGroupStart = eIdx === 0 || !!entry.pageBreakBefore;
      const pageMode = entry.pageMode === 'text' ? 'text' : 'tags';
      let header = '';
      if(isGroupStart){
        header = `
        <div style="background:var(--bg);border-radius:8px;padding:8px;margin:6px 0 4px;">
          <div class="page-mode-choice" data-key="${entry.key}" style="display:flex;gap:6px;margin-bottom:${pageMode==='text'?'6px':'0'};">
            <button type="button" class="page-mode-btn${pageMode==='tags'?' active':''}" data-key="${entry.key}" data-mode="tags" style="flex:1;padding:5px 4px;border-radius:7px;border:1.5px solid ${pageMode==='tags'?'var(--blue)':'var(--border)'};background:${pageMode==='tags'?'#D6EAF8':'#fff'};color:${pageMode==='tags'?'#1B5C8A':'var(--muted)'};font-size:11px;cursor:pointer;">Etiquetas por foto</button>
            <button type="button" class="page-mode-btn${pageMode==='text'?' active':''}" data-key="${entry.key}" data-mode="text" style="flex:1;padding:5px 4px;border-radius:7px;border:1.5px solid ${pageMode==='text'?'#8e44ad':'var(--border)'};background:${pageMode==='text'?'#E8DAEF':'#fff'};color:${pageMode==='text'?'#6C3483':'var(--muted)'};font-size:11px;cursor:pointer;">Campo único</button>
          </div>
          ${pageMode==='text' ? `<textarea class="page-text-input" data-key="${entry.key}" placeholder="Texto desta página (ex: medidas, observações)..." style="width:100%;box-sizing:border-box;min-height:44px;font-size:12.5px;padding:7px 9px;">${escapeHtml(entry.pageText||'')}</textarea>` : ''}
        </div>`;
      }
      const row = `
      ${header}
      <div class="entry-row" data-key="${entry.key}">
        <button class="drag-handle">☰</button>
        <img src="${entry.photo}">
        <div class="er-info">
          <span class="phase-tag phase-${entry.phase}">${phaseLabel(entry)}</span>
          <div class="er-meta">${entry.author ? escapeHtml(entry.author) : 'Sem nome'} · ${new Date(entry.ts).toLocaleDateString('pt-BR')}</div>
        </div>
        <button class="er-edit" data-key="${entry.key}" style="background:none;border:none;color:var(--navy);font-size:16px;padding:6px;cursor:pointer;flex:none;">✎</button>
        <button class="er-del" data-key="${entry.key}">✕</button>
      </div>`;
      if(eIdx === taskEntries.length - 1) return row;
      const nextEntry = taskEntries[eIdx+1];
      const isBreak = !!nextEntry.pageBreakBefore;
      const divider = `
      <button class="page-break-toggle" data-key="${nextEntry.key}" style="
        display:flex;align-items:center;gap:8px;width:100%;background:none;border:none;cursor:pointer;padding:2px 0;margin:2px 0;
      ">
        <span style="flex:1;border-top:${isBreak?'2px dashed var(--orange)':'1px dashed var(--border)'};"></span>
        <span style="font-size:10.5px;font-weight:700;color:${isBreak?'var(--orange)':'var(--muted)'};white-space:nowrap;">${isBreak?'✂ nova página aqui':'mesma página'}</span>
        <span style="flex:1;border-top:${isBreak?'2px dashed var(--orange)':'1px dashed var(--border)'};"></span>
      </button>`;
      return row + divider;
    });
    const rows = rowsParts.join('');
    const isOpen = state.expandedTasks.has(task);
    return `<div class="task-group" data-task="${encodeURIComponent(task)}">
      <div class="task-group-title task-toggle" data-task="${encodeURIComponent(task)}" style="display:flex;justify-content:space-between;align-items:center;cursor:pointer;">
        <span style="display:flex;align-items:center;gap:6px;min-width:0;">
          <button class="drag-handle">☰</button>
          <span class="task-chevron" style="flex:none;">${isOpen ? '▾' : '▸'}</span>
          <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(task)}</span>
          <span style="flex:none;background:var(--border);color:var(--muted);font-size:11px;font-weight:700;border-radius:20px;padding:2px 8px;">${byTask[task].length}</span>
        </span>
        <span style="flex:none;">
          <button class="btn-sm btn-ghost rename-task" data-task="${encodeURIComponent(task)}" style="padding:4px 9px;margin-left:4px;">✎</button>
          <button class="btn-sm btn-ghost move-task-report" data-task="${encodeURIComponent(task)}" style="padding:4px 9px;margin-left:4px;">⇢ relatório</button>
        </span>
      </div>
      <div class="task-group-rows" data-task-rows="${encodeURIComponent(task)}" style="display:${isOpen?'block':'none'};margin-top:8px;">
        ${rows}
      </div>
    </div>`;
  }).join('');


  main.innerHTML = headerCard + `<div class="card"><h2>Fotos (${entries.length})</h2><div id="task-groups-container">${groupsHtml}</div></div>`;

  document.getElementById('btn-edit-header').onclick = ()=>{ state.screen='edit-header'; render(); };

  main.querySelectorAll('.er-del').forEach(btn=>{
    btn.onclick = async ()=>{
      if(!confirm('Remover esta foto do relatório?')) return;
      await deleteEntry(btn.getAttribute('data-key'));
      state.currentEntries = await fetchEntries(state.currentReportId);
      renderReportBody();
    };
  });

  main.querySelectorAll('.er-edit').forEach(btn=>{
    btn.onclick = ()=>{
      const key = btn.getAttribute('data-key');
      const entry = state.currentEntries.find(e=>e.key===key);
      if(!entry) return;
      state.editingEntry = entry;
      state.screen = 'edit-entry';
      render();
    };
  });

  main.querySelectorAll('.move-task-report').forEach(btn=>{
    btn.onclick = ()=>{
      const task = decodeURIComponent(btn.getAttribute('data-task'));
      state.movingTask = task;
      state.screen = 'move-task-report';
      render();
    };
  });

  main.querySelectorAll('.rename-task').forEach(btn=>{
    btn.onclick = async ()=>{
      const task = decodeURIComponent(btn.getAttribute('data-task'));
      await renameTask(task);
    };
  });

  main.querySelectorAll('.page-break-toggle').forEach(btn=>{
    btn.onclick = async ()=>{
      const key = btn.getAttribute('data-key');
      await toggleEntryPageBreak(key);
    };
  });

  main.querySelectorAll('.page-mode-btn').forEach(btn=>{
    btn.onclick = async ()=>{
      const key = btn.getAttribute('data-key');
      const mode = btn.getAttribute('data-mode');
      const entry = state.currentEntries.find(e=>e.key===key);
      if(entry) entry.pageMode = mode;
      await updateEntry(state.currentReportId, key, {pageMode: mode});
      renderReportBody();
    };
  });

  main.querySelectorAll('.page-text-input').forEach(ta=>{
    let debounceTimer = null;
    ta.oninput = ()=>{
      const key = ta.getAttribute('data-key');
      const entry = state.currentEntries.find(e=>e.key===key);
      if(entry) entry.pageText = ta.value;
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(()=>{
        updateEntry(state.currentReportId, key, {pageText: ta.value}).catch(e=>console.error(e));
      }, 500);
    };
  });

  main.querySelectorAll('.task-toggle').forEach(titleEl=>{
    titleEl.onclick = (ev)=>{
      if(ev.target.closest('button')) return;
      const task = decodeURIComponent(titleEl.getAttribute('data-task'));
      const rowsEl = main.querySelector(`.task-group-rows[data-task-rows="${titleEl.getAttribute('data-task')}"]`);
      const chevron = titleEl.querySelector('.task-chevron');
      if(state.expandedTasks.has(task)){
        state.expandedTasks.delete(task);
        if(rowsEl) rowsEl.style.display = 'none';
        if(chevron) chevron.textContent = '▸';
      } else {
        state.expandedTasks.add(task);
        if(rowsEl) rowsEl.style.display = 'block';
        if(chevron) chevron.textContent = '▾';
      }
    };
  });

  // Drag-and-drop reordering of tasks (whole groups)
  const taskContainer = document.getElementById('task-groups-container');
  if(taskContainer){
    enableDragReorder(taskContainer, '.task-group', '.task-group-title .drag-handle', (orderedEls)=>{
      const newTaskOrder = orderedEls.map(el=> decodeURIComponent(el.getAttribute('data-task')));
      updateReportHeader(state.currentReportId, {taskOrder: newTaskOrder})
        .then(()=> fetchHeader(state.currentReportId))
        .then(h=>{ state.currentHeader = h; })
        .catch(e=> console.error('Erro ao salvar ordem das tarefas', e));
    });
  }

  // Drag-and-drop reordering of photos within each task
  main.querySelectorAll('.task-group-rows').forEach(rowsEl=>{
    enableDragReorder(rowsEl, '.entry-row', '.drag-handle', (orderedEls)=>{
      const baseTs = Date.now();
      const keys = orderedEls.map(el=> el.getAttribute('data-key'));
      Promise.all(keys.map((key, i)=> updateEntry(state.currentReportId, key, {ts: baseTs + i})))
        .then(()=>{
          keys.forEach((key, i)=>{
            const entry = state.currentEntries.find(e=>e.key===key);
            if(entry) entry.ts = baseTs + i;
          });
        })
        .catch(e=> console.error('Erro ao salvar ordem das fotos', e));
    });
  });
}

function renderAdd(){
  const existingTasks = [...new Set(state.currentEntries.map(e=>e.task))];
  app.innerHTML = `
    <header class="topbar">
      <button class="back" id="btn-back">←</button>
      <div>
        <h1>Adicionar fotos</h1>
        <div class="sub">${escapeHtml(state.currentHeader.embarcacao)} — ${escapeHtml(state.currentHeader.turma)}</div>
      </div>

    <main>

        <label>Tarefa</label>
        <input type="text" id="f-task" list="task-suggestions" placeholder="Ex: Limpeza do purificador de óleo diesel">
        <datalist id="task-suggestions">
          ${existingTasks.map(t=>`<option value="${escapeHtml(t)}">`).join('')}
        </datalist>

        <label style="margin-top:16px;">Fotos</label>
        <div id="photo-list"></div>
        <button class="btn btn-ghost" id="btn-photo">📷 Tirar / escolher fotos (pode selecionar várias)</button>

        <label>Seu nome (opcional)</label>
        <input type="text" id="f-author" placeholder="Ex: João Silva" value="${escapeHtml(state.authorName)}">

        <div class="btn-row">
          <button class="btn btn-primary" id="btn-save">Salvar fotos</button>
        </div>
      </div>
    </main>
  `;
  document.getElementById('btn-back').onclick = ()=>{ state.screen='report'; render(); renderReportBody(); };

  const photoList = document.getElementById('photo-list');
  function renderPhotoList(){
    if(state.pendingPhotos.length === 0){
      photoList.innerHTML = '';
      return;
    }
    photoList.innerHTML = state.pendingPhotos.map((p, i)=>`
      <div style="display:flex;gap:10px;align-items:center;background:#fff;border:1.5px solid var(--border);border-radius:9px;padding:8px;margin-bottom:8px;">
        <img src="${p.dataUrl}" style="width:56px;height:56px;object-fit:cover;border-radius:6px;flex:none;">
        <div style="flex:1;min-width:0;">
          <div class="phase-choice">
            <button type="button" class="phase-btn${p.phase==='Antes'?' active-Antes':''}" data-idx="${i}" data-phase="Antes">Antes</button>
            <button type="button" class="phase-btn${p.phase==='Durante'?' active-Durante':''}" data-idx="${i}" data-phase="Durante">Durante</button>
            <button type="button" class="phase-btn${p.phase==='Depois'?' active-Depois':''}" data-idx="${i}" data-phase="Depois">Depois</button>
            <button type="button" class="phase-btn${p.phase==='Outro'?' active-Outro':''}" data-idx="${i}" data-phase="Outro">Outro</button>
          </div>
          ${p.phase==='Outro' ? `<input type="text" class="phase-outro-text" data-idx="${i}" placeholder="Escreva a etiqueta..." value="${escapeHtml(p.phaseText||'')}" style="margin-top:6px;padding:8px 10px;font-size:13px;">` : ''}
        </div>
        <button class="photo-remove" data-idx="${i}" style="background:none;border:none;color:var(--danger);font-size:18px;padding:6px;cursor:pointer;flex:none;">✕</button>
      </div>
    `).join('');

    photoList.querySelectorAll('.phase-btn').forEach(btn=>{
      btn.onclick = ()=>{
        const idx = Number(btn.getAttribute('data-idx'));
        state.pendingPhotos[idx].phase = btn.getAttribute('data-phase');
        renderPhotoList();
      };
    });
    photoList.querySelectorAll('.phase-outro-text').forEach(inp=>{
      inp.oninput = ()=>{
        const idx = Number(inp.getAttribute('data-idx'));
        state.pendingPhotos[idx].phaseText = inp.value;
      };
    });
    photoList.querySelectorAll('.photo-remove').forEach(btn=>{
      btn.onclick = ()=>{
        const idx = Number(btn.getAttribute('data-idx'));
        state.pendingPhotos.splice(idx, 1);
        renderPhotoList();
      };
    });
  }
  renderPhotoList();

  document.getElementById('btn-photo').onclick = ()=>{
    const input = document.getElementById('camera-input');
    input.value = '';
    input.onchange = async ()=>{
      if(input.files && input.files.length){
        showToast(input.files.length > 1 ? 'Processando fotos…' : 'Processando foto…');
        for(const file of input.files){
          try{
            const compressed = await compressImage(file);
            state.pendingPhotos.push({...compressed, phase: null, phaseText: ''});
          }catch(e){ console.error(e); showToast('Não foi possível ler uma das fotos.'); }
        }
        renderPhotoList();
      }
    };
    input.click();
  };

  document.getElementById('btn-save').onclick = async ()=>{
    const task = document.getElementById('f-task').value.trim();
    const author = document.getElementById('f-author').value.trim();
    if(state.pendingPhotos.length === 0){ showToast('Adicione ao menos uma foto.'); return; }
    if(!task){ showToast('Informe a tarefa.'); return; }
    const missingPhase = state.pendingPhotos.some(p=>!p.phase);
    if(missingPhase){ showToast('Selecione a fase de cada foto.'); return; }
    const missingOutroText = state.pendingPhotos.some(p=>p.phase==='Outro' && !(p.phaseText||'').trim());
    if(missingOutroText){ showToast('Escreva a etiqueta das fotos marcadas como "Outro".'); return; }
    const btn = document.getElementById('btn-save');
    btn.innerHTML = '<span class="spinner"></span> Salvando…'; btn.disabled = true;
    try{
      if(author) await saveAuthorName(author);
      const baseTs = Date.now();
      await Promise.all(state.pendingPhotos.map((p, i)=> addEntry(state.currentReportId, {
        task, phase: p.phase, phaseText: p.phase==='Outro' ? p.phaseText.trim() : '', author,
        photo: p.dataUrl, w: p.w, h: p.h,
        ts: baseTs + i
      })));
      state.currentEntries = await fetchEntries(state.currentReportId);
      showToast(state.pendingPhotos.length > 1 ? 'Fotos adicionadas!' : 'Foto adicionada!');
      state.pendingPhotos = [];
      state.screen = 'report';
      render();
      renderReportBody();
    }catch(e){
      console.error(e); showToast('Erro ao salvar. Tente novamente.');
      btn.innerHTML = 'Salvar fotos'; btn.disabled = false;
    }
  };
}

  document.getElementById('btn-back').onclick = ()=>{ state.screen='report'; render(); renderReportBody(); };

  let selectedPhase = entry.phase;
  const outroArea = document.getElementById('outro-text-area');
  document.querySelectorAll('.phase-btn').forEach(btn=>{
    btn.onclick = ()=>{
      selectedPhase = btn.getAttribute('data-phase');
      document.querySelectorAll('.phase-btn').forEach(b=>b.className='phase-btn');
      btn.className = `phase-btn active-${selectedPhase}`;
      outroArea.style.display = selectedPhase === 'Outro' ? 'block' : 'none';
    };
  });

  document.getElementById('btn-save-edit').onclick = async ()=>{
    const task = document.getElementById('f-task').value.trim();
    if(!task){ showToast('Informe a tarefa.'); return; }
    if(!selectedPhase){ showToast('Selecione a fase da atividade.'); return; }
    const phaseText = document.getElementById('f-phase-text').value.trim();
    if(selectedPhase === 'Outro' && !phaseText){ showToast('Escreva a etiqueta da fase.'); return; }
    const btn = document.getElementById('btn-save-edit');
    btn.innerHTML = '<span class="spinner"></span> Salvando…'; btn.disabled = true;
    try{
      await updateEntry(state.currentReportId, entry.key, {task, phase: selectedPhase, phaseText: selectedPhase==='Outro' ? phaseText : ''});
      state.currentEntries = await fetchEntries(state.currentReportId);
      showToast('Foto atualizada!');
      state.editingEntry = null;
      state.screen = 'report';
      render();
      renderReportBody();
    }catch(e){
      console.error(e); showToast('Erro ao salvar. Tente novamente.');
      btn.innerHTML = 'Salvar alterações'; btn.disabled = false;
    }
  };

  // Load other reports for the "move to another report" section
  const moveArea = document.getElementById('move-report-area');
  fetchReports().then(reports=>{
    const others = reports.filter(r=>r.id !== state.currentReportId);
    if(others.length === 0){
      moveArea.innerHTML = '<div class="hint">Não há outros relatórios criados ainda.</div>';
      return;
    }
    moveArea.innerHTML = `
      <label>Relatório de destino</label>
      <select id="f-target-report">
        ${others.map(r=>`<option value="${r.id}">${escapeHtml(r.header.embarcacao)} — ${escapeHtml(r.header.turma)} (${escapeHtml(r.header.periodo||'')})</option>`).join('')}
      </select>
      <label>Tarefa no relatório de destino</label>
      <input type="text" id="f-target-task" value="${escapeHtml(entry.task)}">
      <div class="hint">Se já existir uma tarefa com esse nome no outro relatório, a foto entra no mesmo grupo.</div>
      <label>Ação</label>
      <div class="phase-choice" id="action-choice">
        <button type="button" class="phase-btn active-Durante" data-action="move">Mover</button>
        <button type="button" class="phase-btn" data-action="copy">Copiar</button>
      </div>
      <div class="hint">"Mover" tira a foto daqui. "Copiar" mantém aqui e também coloca no outro relatório.</div>
      <div class="btn-row">
        <button class="btn btn-danger-ghost" id="btn-move-report">Mover foto para este relatório</button>
      </div>
    `;
    let action = 'move';
    document.querySelectorAll('#action-choice .phase-btn').forEach(btn=>{
      btn.onclick = ()=>{
        action = btn.getAttribute('data-action');
        document.querySelectorAll('#action-choice .phase-btn').forEach(b=>b.className='phase-btn');
        btn.className = 'phase-btn active-Durante';
        document.getElementById('btn-move-report').textContent = action === 'copy' ? 'Copiar foto para este relatório' : 'Mover foto para este relatório';
      };
    });
    document.getElementById('btn-move-report').onclick = async ()=>{
      const targetId = document.getElementById('f-target-report').value;
      const targetTask = document.getElementById('f-target-task').value.trim();
      if(!targetTask){ showToast('Informe a tarefa no relatório de destino.'); return; }
      const verb = action === 'copy' ? 'Copiar' : 'Mover';
      const warning = action === 'copy' ? '' : ' Ela sairá deste relatório.';
      if(!confirm(`${verb} esta foto para o outro relatório?${warning}`)) return;
      const btn = document.getElementById('btn-move-report');
      const originalLabel = action === 'copy' ? 'Copiar foto para este relatório' : 'Mover foto para este relatório';
      btn.innerHTML = `<span class="spinner"></span> ${action === 'copy' ? 'Copiando' : 'Movendo'}…`; btn.disabled = true;
      try{
        await moveEntryToReport(state.currentReportId, targetId, entry, targetTask, action === 'copy');
        state.currentEntries = await fetchEntries(state.currentReportId);
        showToast(action === 'copy' ? 'Foto copiada para o outro relatório!' : 'Foto movida para o outro relatório!');
        state.editingEntry = null;
        state.screen = 'report';
        render();
        renderReportBody();
      }catch(e){
        console.error(e); showToast(`Erro ao ${action === 'copy' ? 'copiar' : 'mover'} a foto.`);
        btn.innerHTML = originalLabel; btn.disabled = false;
      }
    };
  });
}

function renderMoveTaskReport(){
  const task = state.movingTask;
  const taskEntries = state.currentEntries.filter(e=>e.task===task);
  app.innerHTML = `
    <header class="topbar">
      <button class="back" id="btn-back">←</button>
      <div>
        <h1>Mover tarefa</h1>
        <div class="sub">${escapeHtml(task)}</div>
      </div>
    </header>
    <main>
      <div class="card">
        <h2>${taskEntries.length} foto${taskEntries.length!==1?'s':''} nesta tarefa</h2>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:4px;">
          ${taskEntries.map(e=>`<img src="${e.photo}" style="width:52px;height:52px;object-fit:cover;border-radius:6px;">`).join('')}
        </div>
      </div>
      <div class="card">
        <h2>Mover para outro relatório</h2>
        <div id="move-report-area"><div class="hint">Carregando relatórios…</div></div>
      </div>
    </main>
  `;
  document.getElementById('btn-back').onclick = ()=>{ state.movingTask=null; state.screen='report'; render(); renderReportBody(); };

  const moveArea = document.getElementById('move-report-area');
  fetchReports().then(reports=>{
    const others = reports.filter(r=>r.id !== state.currentReportId);
    if(others.length === 0){
      moveArea.innerHTML = '<div class="hint">Não há outros relatórios criados ainda.</div>';
      return;
    }
    moveArea.innerHTML = `
      <label>Relatório de destino</label>
      <select id="f-target-report">
        ${others.map(r=>`<option value="${r.id}">${escapeHtml(r.header.embarcacao)} — ${escapeHtml(r.header.turma)} (${escapeHtml(r.header.periodo||'')})</option>`).join('')}
      </select>
      <label>Tarefa no relatório de destino</label>
      <input type="text" id="f-target-task" value="${escapeHtml(task)}">
      <div class="hint">Se já existir uma tarefa com esse nome no outro relatório, as fotos entram no mesmo grupo.</div>
      <label>Ação</label>
      <div class="phase-choice" id="action-choice">
        <button type="button" class="phase-btn active-Durante" data-action="move">Mover</button>
        <button type="button" class="phase-btn" data-action="copy">Copiar</button>
      </div>
      <div class="hint">"Mover" tira as fotos daqui. "Copiar" mantém aqui e também coloca no outro relatório.</div>
      <div class="btn-row">
        <button class="btn btn-danger-ghost" id="btn-move-report">Mover ${taskEntries.length} foto${taskEntries.length!==1?'s':''} para este relatório</button>
      </div>
    `;
    let action = 'move';
    document.querySelectorAll('#action-choice .phase-btn').forEach(btn=>{
      btn.onclick = ()=>{
        action = btn.getAttribute('data-action');
        document.querySelectorAll('#action-choice .phase-btn').forEach(b=>b.className='phase-btn');
        btn.className = 'phase-btn active-Durante';
        const verbLabel = action === 'copy' ? 'Copiar' : 'Mover';
        document.getElementById('btn-move-report').textContent = `${verbLabel} ${taskEntries.length} foto${taskEntries.length!==1?'s':''} para este relatório`;
      };
    });
    document.getElementById('btn-move-report').onclick = async ()=>{
      const targetId = document.getElementById('f-target-report').value;
      const targetTask = document.getElementById('f-target-task').value.trim();
      if(!targetTask){ showToast('Informe a tarefa no relatório de destino.'); return; }
      const verb = action === 'copy' ? 'Copiar' : 'Mover';
      const warning = action === 'copy' ? '' : ' Elas sairão deste relatório.';
      if(!confirm(`${verb} todas as ${taskEntries.length} fotos desta tarefa para o outro relatório?${warning}`)) return;
      const btn = document.getElementById('btn-move-report');
      const originalLabel = `${verb} ${taskEntries.length} foto${taskEntries.length!==1?'s':''} para este relatório`;
      btn.innerHTML = `<span class="spinner"></span> ${action === 'copy' ? 'Copiando' : 'Movendo'}…`; btn.disabled = true;
      try{
        await moveTaskToReport(state.currentReportId, targetId, taskEntries, targetTask, action === 'copy');
        state.currentEntries = await fetchEntries(state.currentReportId);
        showToast(action === 'copy' ? 'Tarefa copiada para o outro relatório!' : 'Tarefa movida para o outro relatório!');
        state.movingTask = null;
        state.screen = 'report';
        render();
        renderReportBody();
      }catch(e){
        console.error(e); showToast(`Erro ao ${action === 'copy' ? 'copiar' : 'mover'} a tarefa.`);
        btn.innerHTML = originalLabel; btn.disabled = false;
      }
    };
  });
}

function escapeHtml(s){
  return (s||'').toString().replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ---------- Connectivity banner ----------
function updateOnlineStatus(){
  const el = document.getElementById('offline-banner');
  if(!el) return;
  el.classList.toggle('show', !navigator.onLine);
}
window.addEventListener('online', updateOnlineStatus);
window.addEventListener('offline', updateOnlineStatus);
updateOnlineStatus();

// ---------- Init ----------
async function init(){
  const isAdmin = new URLSearchParams(window.location.search).get('admin') === '1';
  if(isAdmin){
    const adminAuthed = localStorage.getItem('adminAuthed') === '1';
    state.screen = adminAuthed ? 'admin-access' : 'admin-login';
    await loadAuthorName();
    render();
    return;
  }

  const wasApproved = localStorage.getItem('accessApproved') === '1';
  const reqId = localStorage.getItem('accessRequestId');

  if(reqId){
    try{
      const reqDoc = await getAccessRequest(reqId);
      if(reqDoc && reqDoc.status === 'approved'){
        localStorage.setItem('accessApproved', '1');
        await loadAuthorName();
        render();
        return;
      }
      if(reqDoc && reqDoc.status === 'denied'){
        localStorage.removeItem('accessApproved');
        state.screen = 'access-denied';
        render();
        return;
      }
      // status is pending (or the request no longer exists)
      localStorage.removeItem('accessApproved');
      state.screen = 'access-pending';
      render();
      return;
    }catch(e){
      console.error('Erro ao verificar acesso (provavelmente offline)', e);
      // Offline: fall back to the last known status instead of locking the person out.
      if(wasApproved){
        await loadAuthorName();
        render();
        return;
      }
      state.screen = 'access-pending';
      render();
      return;
    }
  }

  state.screen = 'access-request';
  render();
}
init();

</script>
